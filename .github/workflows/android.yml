name: Build APK

on:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm install @capacitor/core @capacitor/android @capacitor/cli

      - name: Copy HTML to www
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Initialize and Sync Capacitor
        run: |
          npx cap init EDUVANCE com.eduvance.school --web-dir www
          npx cap add android
          npx cap sync android

      - name: Fix Android Variables
        run: |
          cat > android/variables.gradle << 'EOF'
          ext {
              minSdkVersion = 23
              compileSdkVersion = 34
              targetSdkVersion = 34

              androidxActivityVersion = '1.7.0'
              androidxAppCompatVersion = '1.6.1'
              androidxCoordinatorLayoutVersion = '1.2.0'
              androidxCoreVersion = '1.10.0'
              androidxFragmentVersion = '1.5.7'

              # ✅ Splash Screen version (important fix)
              coreSplashScreenVersion = '1.0.1'

              junitVersion = '4.13.2'
              androidxJunitVersion = '1.1.5'
              androidxEspressoCoreVersion = '3.5.1'
              cordovaAndroidVersion = '10.1.1'
              kotlinVersion = '1.9.0'
          path: android/app/build/outputs/apk/debug/app-debug.apk
