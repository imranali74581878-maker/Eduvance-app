name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: |
          npm install -g @capacitor/cli
          npm install @capacitor/core @capacitor/android

      - name: Create WWW folder
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Create Capacitor Config
        run: |
          cat > capacitor.config.json <<EOF
          {
            "appId": "com.eduvance.app",
            "appName": "Eduvance",
            "webDir": "www"
          }
          EOF

      - name: Add Android Platform
        run: |
          npx cap add android

      - name: Fix Java and Kotlin Versions
        run: |
          sed -i 's/VERSION_21/VERSION_17/g' android/app/build.gradle || true
          sed -i 's/VERSION_20/VERSION_17/g' android/app/build.gradle || true
          sed -i "s/jvmTarget = '21'/jvmTarget = '17'/g" android/app/build.gradle || true
          sed -i "s/jvmTarget = '20'/jvmTarget = '17'/g" android/app/build.gradle || true
          sed -i 's/1.6.21/1.8.22/g' android/build.gradle || true
          sed -i 's/1.7.10/1.8.22/g' android/build.gradle || true

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Eduvance-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
