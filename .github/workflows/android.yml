name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create package.json
        run: |
          echo '{
            "name": "eduvance-app",
            "version": "1.0.0",
            "description": "Eduvance App",
            "main": "index.js",
            "scripts": {},
            "dependencies": {}
          }' > package.json

      - name: Install Capacitor
        run: |
          npm install @capacitor/cli@6 @capacitor/core@6 @capacitor/android@6

      - name: Create WWW folder
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Create Capacitor Config
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.eduvance.app",
            "appName": "Eduvance",
            "webDir": "www"
          }
          EOF

      - name: Add Android Platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Force Java 17 in ALL Gradle files
        run: |
          find android -type f -name "*.gradle" -exec sed -i 's/VERSION_21/VERSION_17/g' {} +
          find android -type f -name "*.gradle" -exec sed -i 's/JavaVersion.VERSION_21/JavaVersion.VERSION_17/g' {} +
          find android -type f -name "*.gradle" -exec sed -i "s/jvmTarget = '21'/jvmTarget = '17'/g" {} +
          find android -type f -name "*.gradle" -exec sed -i 's/sourceCompatibility = 21/sourceCompatibility = 17/g' {} +
          find android -type f -name "*.gradle" -exec sed -i 's/targetCompatibility = 21/targetCompatibility = 17/g' {} +
          find android -type f -name "*.gradle" -exec sed -i 's/1\.6\.21/1.8.22/g' {} +
          find android -type f -name "*.gradle" -exec sed -i 's/1\.7\.10/1.8.22/g' {} +

      -
